/* ================= renderer / scene ================= */
const canvas = $('c');

/* ================= procedural pixel textures ================= */
const trnd = mulberry32(20240);

const CV = {};
const dirtPix = () => jit(wpick([[0.15, [108, 77, 52]], [0.15, [152, 112, 80]], [1, [134, 96, 67]]]), 0.12);

CV.logTop = canvasOf((x, y) => { const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)); if (d > 6.5) return jit([100, 79, 48], 0.1); const ring = Math.floor(d) % 2; return jit(ring ? [178, 142, 90] : [154, 121, 74], 0.06); });
CV.leaves = canvasOf(() => { if (trnd() < 0.24) return null; return jit(wpick([[0.2, [38, 90, 24]], [0.2, [80, 148, 48]], [1, [56, 118, 36]]]), 0.2); });

CV.iron = oreCanvas([196, 150, 120], [230, 196, 170]);
CV.gold = oreCanvas([236, 196, 36], [255, 242, 140]);

CV.fall = canvasOf((x) => { const s = streak[x] && trnd() < 0.85; return [...jit(s ? [155, 198, 255] : [48, 108, 220], 0.12), 0.84]; });

CV.poppy = plantCanvas(P => { for (let y = 8; y < 16; y++) P(7, y, [52, 110, 30]); [[6,11],[5,10],[8,12],[9,11]].forEach(([x,y]) => P(x, y, [62, 132, 36])); [[6,4],[7,4],[8,4],[6,5],[7,5],[8,5],[5,6],[6,6],[7,6],[8,6],[9,6],[5,7],[6,7],[8,7],[9,7],[6,8],[7,8],[8,8]].forEach(([x,y]) => P(x, y, jit([212, 30, 30], 0.15))); P(7, 7, [40, 28, 10]); P(7, 6, [70, 20, 10]); });

T.fall.wrapS = T.fall.wrapT = THREE.RepeatWrapping; T.fall.repeat.set(3, 55);

{ const fx = fadeC.getContext('2d'); const gr = fx.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, '#fff'); gr.addColorStop(0.5, '#fff'); gr.addColorStop(1, '#000'); fx.fillStyle = gr; fx.fillRect(0, 0, 1, 128); }

/* ================= materials ================= */

  for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) {
    if (!has(i, j)) continue;
    for (let f = 0; f < 6; f++) {
      const F = FACES[f], d = F.dir; if (d[1] === 0 && has(i + d[0], j + d[2])) continue;
      const base = p.length / 3;
      for (const C of F.corners) { p.push((i + C.pos[0]) * scale, C.pos[1] * thick, (j + C.pos[2]) * scale); nn.push(d[0], d[1], d[2]); }
      idx.push(base, base + 1, base + 2, base + 2, base + 1, base + 3);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nn, 3)); g.setIndex(idx); g.computeBoundingSphere(); return g;
}
function cloudLayer(y, seed, thr, thick, shadow){
  const size = 48, scale = 9; const geo = cloudGeo(seed, size, scale, thick, thr, 0.13); const W = size * scale;
  const g = new THREE.Group();
  for (let c = -1; c <= 1; c++) { const m = new THREE.Mesh(geo, cloudMat); m.position.set(c * W - W / 2, 0, -W / 2); m.castShadow = shadow; g.add(m); }
  g.position.y = y; g.userData.W = W; scene.add(g); return g;
}
const cloudsHi = cloudLayer(44, 77, 0.14, 4, true);
const cloudsLo = cloudLayer(-64, 91, -0.06, 7, false);

/* ================= particles ================= */
const FF = 170; const ffPos = new Float32Array(FF * 3), ffBase = new Float32Array(FF * 3), ffPh = new Float32Array(FF);
const ffGeo = new THREE.BufferGeometry(); ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
const ffMat = new THREE.PointsMaterial({ map: dotTex, size: 0.55, color: new THREE.Color(3, 2.6, 0.9), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
const fireflies = new THREE.Points(ffGeo, ffMat); fireflies.frustumCulled = false; scene.add(fireflies);

const SP = 520, GRAV = 14; const spPos = new Float32Array(SP * 3), spVel = new Float32Array(SP * 3);
const spGeo = new THREE.BufferGeometry(); spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
const spMat = new THREE.PointsMaterial({ map: dotTex, size: 0.45, color: 0xe8f4ff, transparent: true, opacity: 0.75, depthWrite: false });
const splash = new THREE.Points(spGeo, spMat); splash.frustumCulled = false; splash.visible = false; scene.add(splash);
let fallInfo = null, waterfall = null;
function spawnSplash(i, advance){
  const f = fallInfo, o = i * 3; const lt = f.lat + (Math.random() - 0.5) * 3; const al = f.edge + f.sgn * 0.5;
  const va = f.sgn * (0.6 + Math.random() * 1.6), vl = (Math.random() - 0.5) * 0.8;
  let px, pz, vx, vz; if (f.axis === 0) { px = al; pz = lt; vx = va; vz = vl; } else { px = lt; pz = al; vx = vl; vz = va; }
  let py = f.y - 0.1, vy = Math.random() * 1.2;
  if (advance) { const t = Math.random() * 2.2; px += vx * t; pz += vz * t; py += vy * t - 0.5 * GRAV * t * t; vy -= GRAV * t; }
  spPos[o] = px; spPos[o + 1] = py; spPos[o + 2] = pz; spVel[o] = vx; spVel[o + 1] = vy; spVel[o + 2] = vz;
}
function makeWaterfall(f){
  if (waterfall) { scene.remove(waterfall); waterfall.geometry.dispose(); waterfall = null; }
  fallInfo = f; if (!f) { splash.visible = false; return; }
  const Hf = 80; const geo = f.axis === 0 ? new THREE.BoxGeometry(0.8, Hf, 3) : new THREE.BoxGeometry(3, Hf, 0.8);
  waterfall = new THREE.Mesh(geo, fallMat); const along = f.edge + f.sgn * 0.4;
  if (f.axis === 0) waterfall.position.set(along, f.y - Hf / 2, f.lat); else waterfall.position.set(f.lat, f.y - Hf / 2, along);
  waterfall.renderOrder = 2; waterfall.receiveShadow = true; scene.add(waterfall);
  for (let i = 0; i < SP; i++) spawnSplash(i, true); splash.visible = true;
}

const parts = []; const partGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15); const partMats = {};
function partMat(t){ const name = BL[t].f[4]; if (!partMats[name]) { const m = MAT[name].clone(); m.vertexColors = false; m.onBeforeCompile = () => {}; partMats[name] = m; } return partMats[name]; }
function spawnBreak(x, y, z, t){
  const m = partMat(t);
  for (let i = 0; i < 16; i++) {
    const p = new THREE.Mesh(partGeo, m); p.position.set(x + 0.2 + Math.random() * 0.6, y + 0.2 + Math.random() * 0.6, z + 0.2 + Math.random() * 0.6);
    p.castShadow = true; p.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    p.userData.v = new THREE.Vector3((Math.random() - 0.5) * 4, 2 + Math.random() * 3, (Math.random() - 0.5) * 4); p.userData.life = 0.8 + Math.random() * 0.6;
    scene.add(p); parts.push(p);
  }
}

/* ================= post-processing ================= */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
try { gtao.updateGtaoMaterial({ radius: 1.1, distanceExponent: 1.4, thickness: 1.5, scale: 1.1, samples: 16 }); gtao.blendIntensity = 0.85; } catch (e) {}
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || innerWidth < 760;
const Q = [
  { name: 'Ультра', pr: Math.min(devicePixelRatio, 2), ao: true, bloom: true, shadow: 4096 },
  { name: 'Высокая', pr: Math.min(devicePixelRatio, 1.25), ao: false, bloom: true, shadow: 2048 },
  { name: 'Средняя', pr: 1, ao: false, bloom: false, shadow: 1024 },
];
let qi = isMobile ? 1 : 0;
function applyQuality(i){
  const q = Q[i]; renderer.setPixelRatio(q.pr); composer.setPixelRatio(q.pr); composer.setSize(innerWidth, innerHeight);
  gtao.enabled = q.ao; bloom.enabled = q.bloom;
  if (sun.shadow.mapSize.x !== q.shadow) { sun.shadow.mapSize.set(q.shadow, q.shadow); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  $('bQuality').textContent = 'Графика: ' + q.name;
}

/* ================= day / night ================= */
let tod = 0.08, cycle = true; const DAYLEN = 300;
const sunDir = new THREE.Vector3(), tmpV = new THREE.Vector3(), tmpC = new THREE.Color();
const C_DAYFOG = new THREE.Color(0xa6c6ea), C_SUNSET = new THREE.Color(0xf2a26c), C_NIGHT = new THREE.Color(0x070b1a);
let lastEnv = -1;
function updateSun(force){
  const phi = tod * Math.PI * 2;
  sunDir.set(Math.cos(phi), Math.sin(phi), 0.32).normalize();
  const el = sunDir.y;
  su.sunPosition.value.copy(sunDir);
  const day = smooth(-0.12, 0.22, el), night = 1 - day;
  const warm = (1 - smooth(0.04, 0.4, el)) * smooth(-0.22, 0.02, el);
  const up = el > -0.03;
  const ld = up ? sunDir : tmpV.copy(sunDir).negate();
  sun.position.copy(ld).multiplyScalar(170);
  if (up) { sun.color.setRGB(1, 0.96, 0.9).lerp(tmpC.setRGB(1, 0.55, 0.3), warm); sun.intensity = 4.2 * smooth(-0.03, 0.15, el); }
  else { sun.color.setRGB(0.55, 0.68, 1.0); sun.intensity = 0.6 * smooth(0.03, 0.2, -el); }
  hemi.intensity = 0.12 + 0.4 * day; hemi.color.setRGB(0.75, 0.85, 1).lerp(tmpC.setRGB(0.25, 0.3, 0.55), night);
  scene.environmentIntensity = 0.25 + 0.75 * day;
  scene.fog.color.copy(C_NIGHT).lerp(C_DAYFOG, day).lerp(C_SUNSET, warm * 0.65);
  starMat.opacity = clamp01(1 - day * 1.6);
  cloudMat.color.setRGB(1, 1, 1).lerp(tmpC.setRGB(1, 0.72, 0.55), warm * 0.7).lerp(tmpC.setRGB(0.12, 0.14, 0.22), night);
  cloudMat.emissive.setRGB(0.3, 0.31, 0.34).multiplyScalar(day);
  for (const l of lamps) l.intensity = l.userData.on ? 2 + night * 45 : 0;
  ffMat.opacity = night * 0.95;
  sunMesh.position.copy(sunDir).multiplyScalar(1400); moonMesh.position.copy(sunDir).multiplyScalar(-1400);
  sunMesh.visible = el > -0.15; moonMesh.visible = el < 0.15;
  renderer.toneMappingExposure = 0.62 + night * 0.25;
  if (force || Math.abs(tod - lastEnv) > 0.004) { lastEnv = tod; updateEnv(); }
  const hrs = (6 + tod * 24) % 24; const hh = Math.floor(hrs), mm = Math.floor((hrs - hh) * 60);
  $('clock').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

/* ================= world setup ================= */
let seed = (Math.random() * 1e9) | 0;
function setupWorld(){
  const info = generateWorld(seed);
  buildTerrain(); buildDeco(); makeWaterfall(info.fall);
  lamps.forEach((l, i) => { const p = info.lampPos[i]; l.userData.on = !!p; if (p) l.position.set(p[0], p[1], p[2]); });
  const cols = info.main.cols, H = info.main.H;
  for (let i = 0; i < FF; i++) { const [x, z] = cols[Math.random() * cols.length | 0]; const h = H.get(ck(x, z)); ffBase[i * 3] = x + 0.5; ffBase[i * 3 + 1] = h + 1.5 + Math.random() * 4; ffBase[i * 3 + 2] = z + 0.5; ffPh[i] = Math.random() * 100; }
  $('seed').textContent = 'seed ' + seed;
  lastEnv = -1;
}
function rebuild(){ buildTerrain(); buildDeco(); }

/* ================= UI ================= */
const HOT = [GRASS, DIRT, STONE, COBBLE, PLANKS, LOG, GLASS, GLOW, LEAVES];
let sel = 0, buildMode = false, rotate = true; const hb = $('hotbar'); const tip = $('tip'); let tipTimer = 0;
function showTip(txt){ tip.textContent = txt; tip.style.opacity = 1; clearTimeout(tipTimer); tipTimer = setTimeout(() => tip.style.opacity = 0, 1800); }
HOT.forEach((t, i) => { const d = document.createElement('div'); d.className = 'slot' + (i === 0 ? ' sel' : ''); const img = new Image(); img.src = CV[BL[t].icon].toDataURL(); d.appendChild(img); const b = document.createElement('b'); b.textContent = i + 1; d.appendChild(b); d.title = BL[t].n; d.onclick = () => selectSlot(i); hb.appendChild(d); });
function selectSlot(i){ sel = i; [...hb.children].forEach((c, j) => c.classList.toggle('sel', j === i)); showTip(BL[HOT[i]].n); }
const todInput = $('tod');
todInput.addEventListener('input', () => { tod = todInput.value / 1000; updateSun(true); });
$('bCycle').onclick = () => { cycle = !cycle; $('bCycle').textContent = 'Цикл дня: ' + (cycle ? 'ВКЛ' : 'ВЫКЛ'); };
$('bRotate').onclick = () => { rotate = !rotate; controls.autoRotate = rotate; $('bRotate').textContent = 'Вращение: ' + (rotate ? 'ВКЛ' : 'ВЫКЛ'); };
const setMode = m => { buildMode = m; $('bMode').textContent = 'Режим: ' + (buildMode ? 'Строить' : 'Ломать'); showTip(buildMode ? 'Клик ставит блок' : 'Клик ломает блок'); };
$('bMode').onclick = () => setMode(!buildMode);
$('bQuality').onclick = () => { qi = (qi + 1) % Q.length; applyQuality(qi); };
$('bNew').onclick = () => { seed = (Math.random() * 1e9) | 0; for (const p of parts) scene.remove(p); parts.length = 0; setupWorld(); updateSun(true); showTip('Новый остров!'); };
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') selectSlot(+e.key - 1);
  else if (e.code === 'KeyB') setMode(!buildMode);
  else if (e.code === 'KeyR') $('bRotate').click();
  else if (e.code === 'KeyN') $('bNew').click();
});

/* ================= interaction ================= */
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
function rayPick(cx, cy){
  mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(terrainMeshes, false); if (!hits.length) return null;
  const h = hits[0]; const n = h.face.normal, p = h.point;
  return { b: [Math.floor(p.x - n.x * 0.5), Math.floor(p.y - n.y * 0.5), Math.floor(p.z - n.z * 0.5)], n: [Math.round(n.x), Math.round(n.y), Math.round(n.z)] };
}
let actx = null;
function crunch(freq = 900){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const len = Math.floor(0.16 * actx.sampleRate); const buf = actx.createBuffer(1, len, actx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); const s = actx.createBufferSource(); s.buffer = buf; const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; const g = actx.createGain(); g.gain.value = 0.35; s.connect(f).connect(g).connect(actx.destination); s.start(); } catch (e) {}
}
const hoverBox = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.004, 1.004, 1.004)), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 }));
hoverBox.visible = false; scene.add(hoverBox);
let downPos = null, lastMove = null, hoverDirty = false, intro = true, introT = 0;
canvas.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY, e.button]; intro = false; hoverBox.visible = false; });
canvas.addEventListener('pointermove', e => { lastMove = [e.clientX, e.clientY]; hoverDirty = true; });
canvas.addEventListener('pointerleave', () => { lastMove = null; hoverBox.visible = false; });
canvas.addEventListener('wheel', () => { intro = false; }, { passive: true });
canvas.addEventListener('pointerup', e => {
  if (!downPos) return; const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]); const btn = downPos[2]; downPos = null;
  if (moved > 6 || btn !== 0) return;
  const hit = rayPick(e.clientX, e.clientY); if (!hit) return;
  const place = buildMode !== e.shiftKey;
  if (!place) {
    const [x, y, z] = hit.b; const t = get(x, y, z); if (!t) return;
    set(x, y, z, AIR); deco.delete(key(x, y + 1, z)); spawnBreak(x, y, z, t); crunch(t === GLASS ? 3000 : 900); rebuild();
  } else {
    const x = hit.b[0] + hit.n[0], y = hit.b[1] + hit.n[1], z = hit.b[2] + hit.n[2]; const t = HOT[sel];
    if (Math.abs(x) > 120 || Math.abs(y) > 120 || Math.abs(z) > 120) return; const cur = get(x, y, z); if (cur && cur !== WATER) return;
    set(x, y, z, t); deco.delete(key(x, y, z)); if (BL[t].o && get(x, y - 1, z) === GRASS) set(x, y - 1, z, DIRT);
    crunch(1600); rebuild();
  }
  hoverDirty = true;
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

/* ================= loop ================= */
const clock = new THREE.Clock(); let elapsed = 0, fpsT = 0, fpsN = 0;
const camFrom = new THREE.Vector3(125, 85, 125), camTo = new THREE.Vector3(40, 24, 44);
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt; timeU.value = elapsed;
  if (cycle) { tod = (tod + dt / DAYLEN) % 1; todInput.value = Math.round(tod * 1000); }
  updateSun(false);
  T.water.offset.set(elapsed * 0.04, elapsed * 0.025);
  T.fall.offset.y = elapsed * 4.0;
  for (const g of [cloudsHi, cloudsLo]) { g.position.x += dt * (g === cloudsHi ? 1.2 : 0.7); if (g.position.x > g.userData.W / 2) g.position.x -= g.userData.W; }
  stars.rotation.y += dt * 0.004;
  if (ffMat.opacity > 0.01) { for (let i = 0; i < FF; i++) { const o = i * 3, ph = ffPh[i]; ffPos[o] = ffBase[o] + Math.sin(elapsed * 0.6 + ph) * 1.3; ffPos[o + 1] = ffBase[o + 1] + Math.sin(elapsed * 1.1 + ph * 2) * 0.6; ffPos[o + 2] = ffBase[o + 2] + Math.cos(elapsed * 0.5 + ph * 3) * 1.3; } ffGeo.attributes.position.needsUpdate = true; }
  if (fallInfo) { for (let i = 0; i < SP; i++) { const o = i * 3; spVel[o + 1] -= GRAV * dt; spPos[o] += spVel[o] * dt; spPos[o + 1] += spVel[o + 1] * dt; spPos[o + 2] += spVel[o + 2] * dt; if (spPos[o + 1] < fallInfo.y - 32) spawnSplash(i, false); } spGeo.attributes.position.needsUpdate = true; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], v = p.userData.v; v.y -= 16 * dt;
    const nx = p.position.x + v.x * dt, ny = p.position.y + v.y * dt, nz = p.position.z + v.z * dt; const t = get(Math.floor(nx), Math.floor(ny), Math.floor(nz));
    if (t && BL[t].o) { v.multiplyScalar(0.3); v.y = Math.abs(v.y) * 0.2; } else p.position.set(nx, ny, nz);
    p.userData.life -= dt; p.scale.setScalar(Math.min(1, p.userData.life * 3));
    if (p.userData.life <= 0) { scene.remove(p); parts.splice(i, 1); }
  }
  if (intro) { introT = Math.min(1, introT + dt / 4.5); const e = 1 - Math.pow(1 - introT, 3); camera.position.lerpVectors(camFrom, camTo, e); camera.lookAt(controls.target); if (introT >= 1) intro = false; }
  else controls.update();
  if (hoverDirty && lastMove && !downPos) { hoverDirty = false; const h = rayPick(lastMove[0], lastMove[1]); if (h) { hoverBox.position.set(h.b[0] + 0.5, h.b[1] + 0.5, h.b[2] + 0.5); hoverBox.visible = true; } else hoverBox.visible = false; }
  sunMesh.lookAt(camera.position); moonMesh.lookAt(camera.position);
  composer.render();
  fpsT += dt; fpsN++; if (fpsT > 0.5) { $('fps').textContent = Math.round(fpsN / fpsT) + ' FPS'; fpsT = 0; fpsN = 0; }
}
controls.addEventListener('start', () => { intro = false; hoverDirty = true; });

async function init(){
  await step(20, 'Генерация текстур...');
  await step(40, 'Генерация острова...');
  setupWorld();
  await step(75, 'Компиляция шейдеров...');
  todInput.value = Math.round(tod * 1000);
  applyQuality(qi); updateSun(true);
  composer.render();
  await step(100, 'Готово!');
  setTimeout(() => $('loader').classList.add('hide'), 250);
  clock.getDelta(); animate();
}
init();
</script>
</body>
