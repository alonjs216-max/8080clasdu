  #cross::before, #cross::after { content: ""; position: absolute; background: rgba(255,255,255,.85); }

  if (d === 0) return false;
  const p = player.pos, old = p[axis]; p[axis] += d;
  if (!collides(p)) return false;
  if (axis === 'y') p.y = d < 0 ? Math.floor(p.y) + 1 : Math.floor(p.y + PH) - PH - 0.001;
  else { const edge = p[axis] + (d > 0 ? PR : -PR); p[axis] = d > 0 ? Math.floor(edge) - PR - 0.001 : Math.floor(edge) + 1 + PR + 0.001; }
  if (collides(p)) p[axis] = old;

}
const _f = new THREE.Vector3(), _r = new THREE.Vector3(), _w = new THREE.Vector3();
function updatePlayer(dt) {
  const inWater = player.pos.y + 0.6 < WATER_SURF;
  camera.getWorldDirection(_f); _f.y = 0; _f.normalize(); _r.crossVectors(_f, camera.up).normalize();
  _w.set(0, 0, 0);
  if (keys.KeyW) _w.add(_f);
  if (keys.KeyS) _w.sub(_f);
  if (keys.KeyD) _w.add(_r);
  if (keys.KeyA) _w.sub(_r);
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 7 : 4.3) * (inWater ? 0.55 : 1);
  if (_w.lengthSq() > 0) _w.normalize().multiplyScalar(speed);
  const k = 1 - Math.exp(-(player.onGround || inWater ? 14 : 4) * dt);
  player.vel.x = lerp(player.vel.x, _w.x, k); player.vel.z = lerp(player.vel.z, _w.z, k);
  if (inWater) { player.vel.y = Math.max(player.vel.y - 9 * dt, -2.5); if (keys.Space) player.vel.y = Math.min(player.vel.y + 22 * dt, 3.2); }
  else { player.vel.y = Math.max(player.vel.y - 28 * dt, -50); if (keys.Space && player.onGround) player.vel.y = 8.7; }
  const dx = player.vel.x * dt, dy = player.vel.y * dt, dz = player.vel.z * dt;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz)) / 0.2));
  let hitX = false, hitZ = false; player.onGround = false;
  for (let i = 0; i < n; i++) {
    if (stepAxis('x', dx / n)) hitX = true;
    if (stepAxis('z', dz / n)) hitZ = true;
    if (stepAxis('y', dy / n)) { if (dy < 0) player.onGround = true; player.vel.y = 0; }
  }
  if (hitX) player.vel.x = 0;
  if (hitZ) player.vel.z = 0;
  if ((hitX || hitZ) && player.onGround && _w.lengthSq() > 0) {
    const test = player.pos.clone().addScaledVector(_w.clone().normalize(), 0.35); test.y += 1.05;
    if (!collides(test)) player.vel.y = 8.2;
  }
  player.pos.x = clamp(player.pos.x, 0.5, SX - 0.5); player.pos.z = clamp(player.pos.z, 0.5, SZ - 0.5);
  if (player.pos.y < -5) spawnPlayer();
  camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
}

const $ = id => document.getElementById(id);
function setButtons() { $('walkBtn').classList.toggle('secondary', mode !== 'walk'); $('orbitBtn').classList.toggle('secondary', mode !== 'orbit'); }
$('walkBtn').onclick = e => {
  e.currentTarget.blur();
  if (mode !== 'walk') {
    savedOrbit.copy(camera.position); mode = 'walk'; orbit.enabled = false;
    camera.near = 0.08; camera.updateProjectionMatrix();
    if (!player.spawned) { spawnPlayer(); player.spawned = true; } else camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
  }
  setButtons(); plc.lock();
};
$('orbitBtn').onclick = e => {
  e.currentTarget.blur();
  if (mode === 'orbit') return;
  mode = 'orbit'; plc.unlock(); orbit.enabled = true;
  camera.position.copy(savedOrbit); camera.near = 0.5; camera.updateProjectionMatrix(); orbit.update(); setButtons();
};
renderer.domElement.addEventListener('click', () => { if (mode === 'walk' && !plc.isLocked) plc.lock(); });
plc.addEventListener('lock', () => document.body.classList.add('walking'));
plc.addEventListener('unlock', () => { document.body.classList.remove('walking'); for (const k in keys) keys[k] = false; });

// ---------- post-processing ----------
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }));
composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: 0.7, distanceExponent: 1, thickness: 1, scale: 1, samples: 16 });
gtao.blendIntensity = 0.85;
composer.addPass(gtao);
const bokeh = new BokehPass(scene, camera, { focus: 100, aperture: 0.00005, maxblur: 0.006 });
composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const fx = { dof: true };
$('fxShadow').onchange = e => { sun.castShadow = e.target.checked; };
$('fxAO').onchange = e => { gtao.enabled = e.target.checked; };
$('fxBloom').onchange = e => { bloom.enabled = e.target.checked; };
$('fxDOF').onchange = e => { fx.dof = e.target.checked; };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------- day / night ----------
let dayTime = 0.08; const DAY_LEN = 300;
const timeSlider = $('time'), autoTime = $('autoTime'), clockEl = $('clock');
timeSlider.value = dayTime;
timeSlider.oninput = () => { dayTime = +timeSlider.value; };
const sunDir = new THREE.Vector3(), lightDir = new THREE.Vector3();
const cWarm = new THREE.Color(1.0, 0.62, 0.36), cWhite = new THREE.Color(1.0, 0.96, 0.9), cMoon = new THREE.Color(0.55, 0.65, 1.0);
const fogDay = new THREE.Color().setRGB(0.70, 0.80, 0.92, THREE.SRGBColorSpace);
const fogSet = new THREE.Color().setRGB(0.93, 0.62, 0.45, THREE.SRGBColorSpace);
const fogNight = new THREE.Color().setRGB(0.02, 0.03, 0.07, THREE.SRGBColorSpace);
const fogWater = new THREE.Color().setRGB(0.05, 0.22, 0.38, THREE.SRGBColorSpace);
const wDay = new THREE.Color(0x0e4a6b), wNight = new THREE.Color(0x020a14), cloudSet = new THREE.Color(1.0, 0.7, 0.5), white = new THREE.Color(1, 1, 1);
let lastEnv = -1, lastClock = '';
function updateSky(t) {
  const phi = dayTime * Math.PI * 2;
  sunDir.set(Math.cos(phi), Math.sin(phi), 0.4).normalize();
  const el = sunDir.y;
  dayF = smooth(-0.12, 0.1, el); nightF = 1 - dayF;
  const sunset = 1 - smooth(0.02, 0.32, Math.abs(el));
  skyU.sunPosition.value.copy(sunDir);
  skyU.rayleigh.value = 1.2 + sunset * 1.8; skyU.turbidity.value = 4 + sunset * 6;
  let glint;
  if (el > -0.03) { lightDir.copy(sunDir); glint = smooth(-0.03, 0.2, el); sun.intensity = 3.4 * glint; sun.color.copy(cWarm).lerp(cWhite, smooth(0.02, 0.45, el)); }
  else { lightDir.copy(sunDir).negate(); const m = smooth(0.03, 0.25, -el); sun.intensity = 0.55 * m; glint = 0.35 * m; sun.color.copy(cMoon); }
  sun.position.copy(CENTER).addScaledVector(lightDir, 180); sun.target.position.copy(CENTER);
  hemi.intensity = 0.12 + 0.5 * dayF;
  hemi.color.setRGB(lerp(0.25, 0.62, dayF), lerp(0.3, 0.76, dayF), lerp(0.55, 1.0, dayF));
  hemi.groundColor.setRGB(lerp(0.05, 0.35, dayF), lerp(0.05, 0.28, dayF), lerp(0.08, 0.2, dayF));
  scene.environmentIntensity = 0.25 + 0.75 * dayF;
  renderer.toneMappingExposure = lerp(0.95, 0.55, dayF);
  scene.fog.color.copy(fogNight).lerp(fogDay, dayF).lerp(fogSet, sunset * 0.65 * smooth(-0.15, 0.05, el));
  scene.fog.density = 0.0028;
  waterU.sunDirection.value.copy(lightDir);
  waterU.sunColor.value.copy(sun.color).multiplyScalar(glint);
  waterU.waterColor.value.copy(wNight).lerp(wDay, dayF);
  stars.material.opacity = nightF; stars.position.copy(camera.position); stars.rotation.z = phi;
  moon.position.copy(camera.position).addScaledVector(sunDir, -3000); moon.lookAt(camera.position);
  moon.material.opacity = smooth(-0.05, 0.1, -el);
  const flick = 0.92 + Math.sin(t * 13) * 0.04 + Math.sin(t * 7.3) * 0.04;
  for (const l of lamps) l.intensity = (3 + 16 * nightF) * flick;
  for (const m of glowMats) m.emissiveIntensity = 1.2 + 2.8 * nightF;
  cloudMat.color.setScalar(lerp(0.12, 1, dayF));
  cloudMat.emissive.copy(white).lerp(cloudSet, sunset * 0.7); cloudMat.emissiveIntensity = 0.04 + 0.3 * dayF;
  leafMat.color.setScalar(0.2 + 0.8 * dayF);
  dustMat.opacity = 0.5 * dayF;

  if (lastEnv < 0 || Math.min(d, 1 - d) > 0.004) { updateEnv(); lastEnv = dayTime; }

}

// ---------- loop ----------
const clock = new THREE.Clock();
const underEl = $('under');
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  frame++;
  if (autoTime.checked) { dayTime = (dayTime + dt / DAY_LEN) % 1; timeSlider.value = dayTime; }
  if (mode === 'walk') { if (plc.isLocked) updatePlayer(dt); } else orbit.update();
  updateSky(t);
  const under = camera.position.y < WATER_SURF;
  if (under) { scene.fog.color.copy(fogWater).multiplyScalar(0.3 + 0.7 * dayF); scene.fog.density = 0.07; }
  underEl.style.opacity = under ? 1 : 0;
  updateSheep(dt); updateParticles(dt, t); updateClouds(dt);
  waterU.time.value += dt * 0.6;
  timeU.value = t;
  bokeh.enabled = fx.dof && mode === 'orbit';
  if (bokeh.enabled) bokeh.uniforms.focus.value = camera.position.distanceTo(orbit.target);
  renderer.shadowMap.needsUpdate = true;
  composer.render(dt);
}
updateSky(0);
animate();
requestAnimationFrame(() => $('loading').classList.add('hide'));
</script>
